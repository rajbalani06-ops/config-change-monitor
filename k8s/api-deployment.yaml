apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccm-api
  namespace: ccm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ccm-api
  template:
    metadata:
      labels:
        app: ccm-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: ccm-api:local
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ccm-config
            - secretRef:
                name: ccm-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ccm-api
  namespace: ccm
spec:
  selector:
    app: ccm-api
  ports:
    - port: 8080
      targetPort: 8080
